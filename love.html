<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>💌 Тебе письмо</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Great+Vibes&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg-deep:#241019;
    --bg-deep-2:#3a1730;
    --bg-deep-3:#4a1d2e;
    --paper:#f4e8cf;
    --paper-2:#eaddc0;
    --paper-edge:#d9c39a;
    --ink:#4a3320;
    --ink-soft:#8a7256;
    --wine:#8f2438;
    --wine-light:#b5445a;
    --wine-deep:#571422;
    --gold:#c9a24d;
    --gold-soft:#e4c887;
    --gold-pale:#f2ddab;
    --blush:#e7b6bd;
    --cream:#f8efdd;
    --shadow-black:rgba(15,4,9,0.55);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:'Inter','Helvetica Neue',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
      radial-gradient(circle at 18% 18%, rgba(143,36,56,0.28), transparent 42%),
      radial-gradient(circle at 84% 78%, rgba(201,162,77,0.14), transparent 45%),
      linear-gradient(165deg, var(--bg-deep) 0%, var(--bg-deep-2) 55%, var(--bg-deep-3) 100%);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .page{
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    width:100vw;
    height:100vh;
    padding:24px;
    position:absolute;
    top:0; left:0;
    background:
      radial-gradient(circle at 18% 18%, rgba(143,36,56,0.28), transparent 42%),
      radial-gradient(circle at 84% 78%, rgba(201,162,77,0.14), transparent 45%),
      linear-gradient(165deg, var(--bg-deep) 0%, var(--bg-deep-2) 55%, var(--bg-deep-3) 100%);
    animation:fadeIn 0.8s cubic-bezier(0.23,1,0.32,1) forwards;
    overflow:hidden;
  }
  .page.active{display:flex;}

  @keyframes fadeIn{
    0%{opacity:0; transform:scale(0.97) translateY(8px);}
    100%{opacity:1; transform:scale(1) translateY(0);}
  }
  @keyframes float{
    0%,100%{transform:translateY(0px);}
    50%{transform:translateY(-7px);}
  }

  /* ============================================================ */
  /* СЫПЛЮЩИЕСЯ СЛОВА / ЗВЁЗДЫ (переиспользуемый мотив) */
  /* ============================================================ */
  .rain{
    position:absolute; inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
  }
  .rain-item{
    position:absolute;
    white-space:nowrap;
    animation:fall linear infinite;
    opacity:0;
  }
  .rain-item.word{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    color:rgba(231,182,189,0.16);
    letter-spacing:1px;
  }
  .rain-item.star{
    font-family:serif;
    color:rgba(201,162,77,0.28);
  }
  @keyframes fall{
    0%{transform:translateY(-24px) rotate(0deg); opacity:0;}
    12%{opacity:1;}
    88%{opacity:1;}
    100%{transform:translateY(calc(100vh + 40px)) rotate(4deg); opacity:0;}
  }

  /* ============================================================ */
  /* КОНВЕРТ */
  /* ============================================================ */
  .envelope-wrapper{
    position:relative;
    z-index:1;
    animation:flyIn 1.1s cubic-bezier(0.23,1,0.32,1) forwards;
    opacity:0;
    transform:translateY(-34px) rotate(-1deg);
    filter:drop-shadow(0 30px 55px var(--shadow-black));
  }
  @keyframes flyIn{
    0%{opacity:0; transform:translateY(-54px) scale(0.9) rotate(-2deg);}
    100%{opacity:1; transform:translateY(0) scale(1) rotate(0deg);}
  }

  .envelope{
    position:relative;
    width:520px;
    height:350px;
    background:linear-gradient(155deg, var(--paper) 0%, var(--paper-2) 100%);
    border-radius:5px;
    border:1px solid var(--paper-edge);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.35),
      inset 0 40px 60px -30px rgba(255,255,255,0.4),
      inset 0 -50px 60px -35px rgba(90,50,30,0.12);
  }

  .envelope .flap{
    position:absolute;
    top:-1px; left:-1px;
    width:calc(100% + 2px);
    height:110px;
    background:linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
    clip-path:polygon(50% 0%, 0% 100%, 100% 100%);
    border-top:1px solid var(--paper-edge);
    border-left:1px solid var(--paper-edge);
    border-right:1px solid var(--paper-edge);
    border-radius:5px 5px 0 0;
    z-index:5;
    box-shadow:
      0 8px 16px -8px rgba(30,10,15,0.18),
      inset 0 -14px 22px -6px rgba(140,90,60,0.14);
  }

  .envelope .fold-left,
  .envelope .fold-right,
  .envelope .fold-left-bottom,
  .envelope .fold-right-bottom{
    position:absolute;
    width:160px;
    height:176px;
    background:linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
    z-index:1;
  }
  .envelope .fold-left{
    top:-1px; left:-1px;
    border-top:1px solid var(--paper-edge);
    border-left:1px solid var(--paper-edge);
    border-radius:5px 0 0 0;
    clip-path:polygon(0 0, 100% 0, 0 100%);
    box-shadow:inset -8px 8px 18px -4px rgba(140,90,60,0.10);
  }
  .envelope .fold-right{
    top:-1px; right:-1px;
    border-top:1px solid var(--paper-edge);
    border-right:1px solid var(--paper-edge);
    border-radius:0 5px 0 0;
    clip-path:polygon(100% 0, 100% 100%, 0 0);
    box-shadow:inset 8px 8px 18px -4px rgba(140,90,60,0.10);
  }
  .envelope .fold-left-bottom{
    bottom:-1px; left:-1px;
    border-bottom:1px solid var(--paper-edge);
    border-left:1px solid var(--paper-edge);
    border-radius:0 0 0 5px;
    clip-path:polygon(0 0, 0 100%, 100% 100%);
    box-shadow:inset -8px -8px 18px -4px rgba(140,90,60,0.10);
  }
  .envelope .fold-right-bottom{
    bottom:-1px; right:-1px;
    border-bottom:1px solid var(--paper-edge);
    border-right:1px solid var(--paper-edge);
    border-radius:0 0 5px 0;
    clip-path:polygon(100% 0, 100% 100%, 0 100%);
    box-shadow:inset 8px -8px 18px -4px rgba(140,90,60,0.10);
  }

  /* === ЛЕНТА === */
  .envelope-ribbon{
    position:absolute;
    top:-1px; left:50%;
    width:28px;
    height:calc(100% + 2px);
    transform:translateX(-50%);
    background:linear-gradient(90deg,
      var(--wine-deep) 0%, var(--wine) 18%, var(--wine-light) 48%,
      var(--wine) 78%, var(--wine-deep) 100%);
    box-shadow:0 6px 14px -4px rgba(20,5,10,0.35), inset 0 0 0 1px rgba(255,255,255,0.08);
    z-index:6;
  }
  .envelope-ribbon::before{
    content:'';
    position:absolute; inset:0;
    background:repeating-linear-gradient(180deg,
      rgba(255,255,255,0.10) 0px, rgba(255,255,255,0.10) 1px,
      transparent 1px, transparent 7px);
    mix-blend-mode:overlay;
  }

  /* === ВОСКОВАЯ ПЕЧАТЬ === */
  .wax-seal{
    position:absolute;
    top:31.2%; left:50%;
    transform:translate(-50%,-50%);
    width:72px; height:72px;
    z-index:8;
    cursor:pointer;
    border-radius:50%;
    background:radial-gradient(circle at 34% 28%, var(--wine-light) 0%, var(--wine) 42%, var(--wine-deep) 88%);
    box-shadow:
      0 10px 22px -6px rgba(15,3,7,0.5),
      inset 0 3px 5px rgba(255,255,255,0.28),
      inset 0 -5px 9px rgba(0,0,0,0.32);
    display:flex; align-items:center; justify-content:center;
    animation:float 3.2s ease-in-out infinite;
    transition:transform 0.35s cubic-bezier(0.23,1,0.32,1), box-shadow 0.35s ease;
  }
  .wax-seal::before,
  .wax-seal::after{
    content:'';
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--wine-light), var(--wine-deep) 85%);
    box-shadow:inset 0 2px 3px rgba(255,255,255,0.2);
  }
  .wax-seal::before{ width:14px; height:12px; bottom:-4px; left:8px; }
  .wax-seal::after{ width:10px; height:9px; bottom:-2px; right:10px; }
  .wax-seal .ring{
    position:absolute; inset:-9px;
    border-radius:50%;
    border:1px solid rgba(201,162,77,0.28);
    animation:pulseRing 2.6s ease-in-out infinite;
  }
  @keyframes pulseRing{
    0%,100%{transform:scale(1); opacity:0.35;}
    50%{transform:scale(1.14); opacity:0;}
  }
  .wax-seal svg{
    width:30px; height:30px;
    fill:var(--gold-pale);
    filter:drop-shadow(0 1px 1px rgba(0,0,0,0.35));
    position:relative; z-index:1;
  }
  .wax-seal:hover{
    transform:translate(-50%,-50%) scale(1.07);
    box-shadow:0 14px 30px -6px rgba(15,3,7,0.55), inset 0 3px 5px rgba(255,255,255,0.32), inset 0 -5px 9px rgba(0,0,0,0.32);
  }
  .wax-seal:active{ transform:translate(-50%,-50%) scale(0.93); }

  .wax-seal.cracking{ animation:crackShake 0.5s ease; }
  @keyframes crackShake{
    0%,100%{transform:translate(-50%,-50%) rotate(0deg);}
    25%{transform:translate(-50%,-50%) rotate(-4deg);}
    50%{transform:translate(-50%,-50%) rotate(3deg) scale(1.05);}
    75%{transform:translate(-50%,-50%) rotate(-2deg);}
  }
  .envelope-ribbon.untying{
    animation:ribbonFade 0.6s ease forwards;
    animation-delay:0.25s;
  }
  @keyframes ribbonFade{
    0%{opacity:1;}
    100%{opacity:0; transform:translateX(-50%) scaleX(0.4);}
  }

  /* === МАРКИ === */
  .stamps-layer{ position:absolute; inset:0; z-index:4; pointer-events:none; }
  .stamp{
    position:absolute;
    width:70px; height:78px;
    border-radius:3px;
    border:2px dashed rgba(201,162,77,0.55);
    background:var(--cream);
    box-shadow:0 4px 12px -4px rgba(30,10,15,0.25), inset 0 0 0 1px rgba(255,255,255,0.5);
    display:flex; align-items:center; justify-content:center;
  }
  .stamp svg{ width:24px; height:24px; }
  .stamp-a{ top:35%; left:4.3%; transform:rotate(-9deg); }
  .stamp-b{ top:31%; right:4%; transform:rotate(12deg); }
  .stamp-c{ top:56%; left:5.6%; transform:rotate(6deg); }
  .stamp-d{ top:59%; right:5.2%; transform:rotate(-13deg); }

  /* === АДРЕС === */
  .envelope-address{
    position:absolute;
    bottom:30px; left:38px;
    color:var(--ink-soft);
    font-size:0.5rem;
    letter-spacing:3px;
    text-transform:uppercase;
    font-weight:400;
    z-index:4;
  }
  .envelope-address span{
    display:block;
    font-family:'Great Vibes', cursive;
    font-size:1.9rem;
    color:var(--wine);
    letter-spacing:1px;
    margin-top:4px;
    line-height:1;
  }

  .hint-text{
    margin-top:38px;
    color:var(--gold-soft);
    font-size:0.65rem;
    letter-spacing:5px;
    font-weight:300;
    text-transform:uppercase;
    animation:blink 2.6s ease-in-out infinite;
    z-index:1;
    position:relative;
  }
  @keyframes blink{ 0%,100%{opacity:0.35;} 50%{opacity:0.85;} }

  /* ============================================================ */
  /* КАРТОЧКИ (страницы 2 / 4) */
  /* ============================================================ */
  .card{
    background:linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
    border:1px solid var(--paper-edge);
    border-radius:20px;
    box-shadow:0 30px 70px -20px rgba(10,2,6,0.5), inset 0 1px 0 rgba(255,255,255,0.5);
    animation:fadeIn 0.8s cubic-bezier(0.23,1,0.32,1) forwards;
  }

  .code-box{ padding:46px 42px 50px; text-align:center; max-width:380px; width:100%; }
  .code-box .ornament{
    font-size:0.7rem; letter-spacing:8px; color:var(--gold);
    margin-bottom:14px; font-weight:400;
  }
  .code-box h2{
    font-family:'Playfair Display', serif; font-weight:500;
    font-size:1.25rem; color:var(--wine); margin-bottom:4px; letter-spacing:2px;
  }
  .code-box .sub{
    color:var(--ink-soft); font-size:0.62rem; letter-spacing:4px;
    text-transform:uppercase; margin-bottom:30px; font-weight:400;
  }
  .code-input{
    background:transparent; border:none;
    border-bottom:2px solid rgba(143,36,56,0.22);
    padding:16px 10px 12px; font-size:2.4rem; text-align:center;
    color:var(--wine); width:200px; outline:none; letter-spacing:10px;
    transition:border-color 0.4s ease; font-weight:400;
    font-family:'Cormorant Garamond', serif;
  }
  .code-input:focus{ border-bottom-color:var(--wine); }
  .code-input::placeholder{ color:var(--paper-edge); letter-spacing:6px; font-size:0.9rem; }

  .code-btn{
    margin-top:30px;
    background:linear-gradient(160deg, var(--wine-light), var(--wine-deep));
    border:none; color:var(--gold-pale);
    padding:14px 48px; border-radius:60px;
    font-size:0.72rem; font-weight:500; letter-spacing:4px; text-transform:uppercase;
    cursor:pointer; transition:all 0.4s cubic-bezier(0.23,1,0.32,1);
    opacity:0.3; pointer-events:none; font-family:'Inter', sans-serif;
  }
  .code-btn.active{
    opacity:1; pointer-events:auto;
    box-shadow:0 10px 28px -8px rgba(143,36,56,0.55);
  }
  .code-btn.active:hover{ transform:scale(1.03); box-shadow:0 14px 34px -8px rgba(143,36,56,0.65); }

  .code-error{
    color:var(--wine); font-size:0.7rem; margin-top:16px; height:20px;
    opacity:0; transition:opacity 0.3s ease; letter-spacing:1px;
  }
  .code-error.show{ opacity:1; }

  /* === PAGE 3 — РАСКРЫТИЕ === */
  .open-envelope{
    position:relative; width:520px; height:350px;
    animation:openReveal 1.2s cubic-bezier(0.23,1,0.32,1) forwards;
    opacity:0; transform:scale(0.9) rotate(-1deg);
    margin-bottom:22px;
    filter:drop-shadow(0 30px 55px var(--shadow-black));
  }
  @keyframes openReveal{
    0%{opacity:0; transform:scale(0.88) rotate(-2deg);}
    100%{opacity:1; transform:scale(1) rotate(0deg);}
  }
  .open-envelope .envelope-body{
    width:100%; height:100%;
    background:linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
    border-radius:5px; border:1px solid var(--paper-edge);
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.35);
  }
  .open-envelope .flap-open{
    position:absolute; top:-1px; left:50%;
    transform:translateX(-50%) rotateX(180deg);
    width:calc(100% + 2px); height:110px;
    background:linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
    clip-path:polygon(50% 0%, 0% 100%, 100% 100%);
    border-top:1px solid var(--paper-edge);
    border-left:1px solid var(--paper-edge);
    border-right:1px solid var(--paper-edge);
    border-radius:5px 5px 0 0;
    transform-origin:bottom;
    animation:flapUp 1s cubic-bezier(0.23,1,0.32,1) forwards;
    animation-delay:0.3s; z-index:2;
    box-shadow:inset 0 -14px 22px -6px rgba(140,90,60,0.14);
  }
  @keyframes flapUp{
    0%{transform:translateX(-50%) rotateX(0deg);}
    100%{transform:translateX(-50%) rotateX(180deg);}
  }
  .photo-inside{
    width:86%; height:74%;
    border-radius:4px; border:1px solid rgba(143,36,56,0.1);
    box-shadow:0 8px 30px -10px rgba(30,10,15,0.3);
    background:linear-gradient(155deg, var(--wine-deep), var(--wine));
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative; z-index:3;
    opacity:0;
    animation:photoReveal 1s cubic-bezier(0.23,1,0.32,1) forwards;
    animation-delay:0.9s;
  }
  .photo-inside img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-placeholder{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    color:var(--gold-pale);
  }
  .photo-placeholder svg{ width:38px; height:38px; opacity:0.8; }
  .photo-placeholder span{
    font-family:'Cormorant Garamond', serif; font-style:italic;
    font-size:0.85rem; letter-spacing:1px; opacity:0.8;
  }
  @keyframes photoReveal{
    0%{opacity:0; transform:scale(0.92);}
    100%{opacity:1; transform:scale(1);}
  }

  .audio-wrapper{
    margin-bottom:20px; opacity:0;
    animation:fadeIn 0.8s ease forwards; animation-delay:1.4s;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .audio-hint{
    font-size:0.55rem; color:var(--gold-soft); letter-spacing:3px;
    text-transform:uppercase; font-weight:400;
  }
  .audio-wrapper audio{
    width:300px; border-radius:60px;
    background:var(--paper); border:1px solid var(--paper-edge);
    height:44px; outline:none;
  }

  .next-btn{
    background:rgba(244,232,207,0.08);
    border:1.5px solid var(--gold);
    color:var(--gold-pale);
    padding:14px 50px; border-radius:60px;
    font-size:0.7rem; letter-spacing:5px; text-transform:uppercase;
    cursor:pointer; transition:all 0.4s cubic-bezier(0.23,1,0.32,1);
    font-weight:500; font-family:'Inter', sans-serif;
  }
  .next-btn:hover{
    background:var(--gold); color:var(--wine-deep);
    transform:scale(1.03); box-shadow:0 12px 32px -8px rgba(201,162,77,0.4);
  }

  /* === PAGE 4 — ПРИГЛАШЕНИЕ === */
  .invite-card{ padding:50px 44px 46px; max-width:480px; width:100%; text-align:center; }
  .invite-card .ornament{
    font-size:0.65rem; letter-spacing:8px; color:var(--gold); margin-bottom:10px; font-weight:400;
  }
  .invite-card h1{
    font-family:'Great Vibes', cursive; font-weight:400;
    font-size:2.4rem; color:var(--wine); letter-spacing:1px; margin-bottom:6px; line-height:1;
  }
  .invite-card .message{
    color:var(--ink-soft); font-size:0.92rem; line-height:1.85;
    margin:18px 0 26px; font-weight:400; letter-spacing:0.2px;
    font-family:'Cormorant Garamond', serif;
  }
  .invite-card .message strong{ color:var(--wine); font-weight:600; }
  .invite-card .date{
    font-family:'Playfair Display', serif; font-size:2.6rem; font-weight:500;
    color:var(--wine); letter-spacing:3px; margin:10px 0 20px;
  }
  .invite-card .date em{ font-style:italic; color:var(--gold); opacity:0.85; font-weight:400; }

  .time-select{ display:flex; flex-direction:column; gap:10px; margin:18px 0 30px; align-items:center; }
  .time-select label{
    color:var(--ink-soft); font-size:0.6rem; letter-spacing:4px; text-transform:uppercase; font-weight:400;
  }
  .time-select input[type="time"]{
    background:rgba(255,255,255,0.35);
    border:2px solid rgba(143,36,56,0.16);
    border-radius:60px; padding:14px 32px; font-size:1.3rem;
    color:var(--wine); outline:none; width:200px; text-align:center;
    transition:border-color 0.4s ease; font-family:'Cormorant Garamond', serif; font-weight:500;
  }
  .time-select input[type="time"]:focus{ border-color:var(--wine); }

  .confirm-btn{
    background:linear-gradient(160deg, var(--wine-light), var(--wine-deep));
    border:none; color:var(--gold-pale);
    padding:16px 52px; border-radius:60px;
    font-size:0.75rem; font-weight:500; letter-spacing:5px; text-transform:uppercase;
    cursor:pointer; transition:all 0.4s cubic-bezier(0.23,1,0.32,1);
    width:100%; max-width:280px; margin:0 auto; font-family:'Inter', sans-serif;
    box-shadow:0 10px 28px -8px rgba(143,36,56,0.5);
  }
  .confirm-btn:hover{ transform:scale(1.03); box-shadow:0 14px 34px -8px rgba(143,36,56,0.65); }

  /* === PAGE 5 — ФИНАЛ === */
  .final-box{ text-align:center; animation:fadeIn 1s cubic-bezier(0.23,1,0.32,1) forwards; max-width:480px; width:100%; position:relative; z-index:1; }
  .final-box .divider{ width:44px; height:1px; background:var(--gold); opacity:0.5; margin:0 auto 16px; }
  .final-title{
    font-family:'Great Vibes', cursive; font-weight:400;
    font-size:3rem; color:var(--gold-pale); letter-spacing:1px; margin-bottom:6px; line-height:1;
  }
  .final-title .heart-mark{ color:var(--wine-light); font-size:1.6rem; vertical-align:middle; }
  .final-sub{
    color:var(--blush); font-size:0.62rem; letter-spacing:6px; text-transform:uppercase;
    margin-bottom:34px; font-weight:400; opacity:0.85;
  }

  .timer-box{ display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin:16px 0 8px; }
  .timer-item{
    background:rgba(244,232,207,0.06);
    border:1px solid rgba(201,162,77,0.22);
    border-radius:14px; padding:18px 16px 14px; min-width:74px; text-align:center;
  }
  .timer-item .num{
    font-family:'Playfair Display', serif; font-size:2.4rem; font-weight:500;
    color:var(--gold-soft); letter-spacing:1px; display:block; line-height:1;
  }
  .timer-item .label{
    font-size:0.5rem; color:var(--blush); letter-spacing:3px; text-transform:uppercase;
    margin-top:8px; font-weight:400; opacity:0.8;
  }

  .final-heart{
    margin-top:30px; font-size:1.1rem; color:var(--blush);
    letter-spacing:3px; font-weight:400; animation:float 3.4s ease-in-out infinite;
    font-family:'Cormorant Garamond', serif; font-style:italic;
  }
  .final-heart span{ display:inline-block; animation:pulseHeart 2s ease-in-out infinite; color:var(--wine-light); }
  @keyframes pulseHeart{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }

  /* ===== АДАПТИВ ===== */
  @media (max-width:550px){
    .envelope, .open-envelope{ width:380px; height:256px; }
    .envelope .flap, .open-envelope .flap-open{ height:80px; }
    .envelope .fold-left, .envelope .fold-right,
    .envelope .fold-left-bottom, .envelope .fold-right-bottom{ width:117px; height:129px; }
    .envelope-ribbon{ width:20px; }
    .wax-seal{ width:54px; height:54px; }
    .wax-seal svg{ width:22px; height:22px; }
    .stamp{ width:38px; height:44px; }
    .stamp svg{ width:18px; height:18px; }
    .envelope-address{ bottom:16px; left:20px; font-size:0.42rem; }
    .envelope-address span{ font-size:1.35rem; }
    .code-box{ padding:34px 22px 36px; }
    .code-input{ font-size:2rem; width:150px; }
    .invite-card{ padding:34px 22px 30px; }
    .invite-card h1{ font-size:1.9rem; }
    .invite-card .date{ font-size:2.1rem; }
    .timer-item{ min-width:60px; padding:14px 10px; }
    .timer-item .num{ font-size:1.8rem; }
    .audio-wrapper audio{ width:220px; }
    .final-title{ font-size:2.3rem; }
  }
  @media (max-width:400px){
    .envelope, .open-envelope{ width:296px; height:200px; }
    .envelope .flap, .open-envelope .flap-open{ height:62px; }
    .envelope .fold-left, .envelope .fold-right,
    .envelope .fold-left-bottom, .envelope .fold-right-bottom{ width:92px; height:100px; }
    .wax-seal{ width:42px; height:42px; }
    .wax-seal svg{ width:18px; height:18px; }
    .stamp{ width:30px; height:35px; }
    .stamp svg{ width:14px; height:14px; }
    .code-input{ font-size:1.6rem; width:120px; letter-spacing:6px; }
    .envelope-ribbon{ width:15px; }
  }
</style>
</head>
<body>

<!-- ========================================================== -->
<!-- PAGE 1 — КОНВЕРТ -->
<!-- ========================================================== -->
<div class="page active" id="page1">
  <div class="rain" id="complimentsRain"></div>

  <div class="envelope-wrapper">
    <div class="envelope">
      <div class="fold-left"></div>
      <div class="fold-right"></div>
      <div class="fold-left-bottom"></div>
      <div class="fold-right-bottom"></div>

      <div class="stamps-layer">
        <div class="stamp stamp-a" aria-hidden="true">
  <img src="photo_2026-08-24_17-08-12.jpg" alt="Марка" style="width:100%;height:100%;object-fit:cover;border-radius:3px;" />
</div>
        <div class="stamp stamp-b" aria-hidden="true">
    <img src="photo_2026-08-24_16-56-43.jpg" alt="Марка" style="width:100%;height:100%;object-fit:cover;border-radius:3px;" />
  </div>
       <div class="stamp stamp-c" aria-hidden="true">
    <img src="photo_2026-08-24_16-56-59.jpg" alt="Марка" style="width:100%;height:100%;object-fit:cover;border-radius:3px;" />
  </div>
      <div class="stamp stamp-d" aria-hidden="true">
    <img src="photo_2026-08-24_16-56-53.jpg" alt="Марка" style="width:100%;height:100%;object-fit:cover;border-radius:3px;" />
  </div>
      </div>

      <div class="envelope-ribbon" id="ribbon"></div>

      <div class="wax-seal" id="waxSeal">
        <div class="ring"></div>
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>

      <div class="flap"></div>

      <div class="envelope-address">
        для <span>Душки</span>
      </div>
    </div>
  </div>

  <div class="hint-text">нажми на печать</div>
</div>

<!-- ========================================================== -->
<!-- PAGE 2 — КОД -->
<!-- ========================================================== -->
<div class="page" id="page2">
  <div class="card code-box">
    <div class="ornament">✦ ✦ ✦</div>
    <h2>секретный код</h2>
    <div class="sub">введи заветные цифры</div>
    <input type="password" class="code-input" id="codeInput" maxlength="6" placeholder="· · · ·" autofocus />
    <div class="code-error" id="codeError">Любимая, неверно, попробуй ещё</div>
    <button class="code-btn" id="codeBtn">открыть</button>
  </div>
</div>

<!-- ========================================================== -->
<!-- PAGE 3 — РАСКРЫТИЕ -->
<!-- ========================================================== -->
<div class="page" id="page3">
  <div class="open-envelope">
    <div class="envelope-body">
      <div class="flap-open"></div>
<div class="photo-inside">
  <img src="photo_2026-08-24_16-45-48.jpg" alt="Наше фото" />
</div>
    </div>
  </div>

  <div class="audio-wrapper">
    <div class="audio-hint">♫ включи</div>
    <!-- замени src на свою композицию -->
    <audio controls id="customAudio">
      <source src="videoplayback (online-video-cutter.com).mp3" type="audio/mpeg" />
    </audio>
  </div>

  <button class="next-btn" id="goToInvite">дальше →</button>
</div>

<!-- ========================================================== -->
<!-- PAGE 4 — ПРИГЛАШЕНИЕ -->
<!-- ========================================================== -->
<div class="page" id="page4">
  <div class="card invite-card">
    <div class="ornament">✦ ✦ ✦</div>
    <h1>Душка</h1>
    <div class="message">
      Я приглашаю тебя<br />
      <strong>провести нежный вечер вместе</strong> ❤
    </div>
    <div class="date">26 <em>августа</em></div>
    <div class="time-select">
      <label>выбери время</label>
      <input type="time" id="timePicker" value="19:00" />
    </div>
    <button class="confirm-btn" id="confirmTime">✦ согласна ✦</button>
  </div>
</div>

<!-- ========================================================== -->
<!-- PAGE 5 — ФИНАЛ -->
<!-- ========================================================== -->
<div class="page" id="page5">
  <div class="rain" id="starsRain"></div>
  <div class="final-box">
    <div class="divider"></div>
    <div class="final-title">Я <span class="heart-mark">❤</span> Ты</div>
    <div class="final-sub">скоро встретимся</div>

    <div class="timer-box" id="timerBox">
      <div class="timer-item"><span class="num" id="days">00</span><span class="label">дней</span></div>
      <div class="timer-item"><span class="num" id="hours">00</span><span class="label">часов</span></div>
      <div class="timer-item"><span class="num" id="minutes">00</span><span class="label">минут</span></div>
      <div class="timer-item"><span class="num" id="seconds">00</span><span class="label">секунд</span></div>
    </div>

    <div class="final-heart"><span>❤</span> жду с нетерпением <span>❤</span></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var CORRECT_CODE = '0907';

  var compliments = [
    'самая красивая', 'нежная', 'умная', 'очаровательная',
    'прекрасная', 'загадочная', 'солнечная', 'неповторимая',
    'чудесная', 'восхитительная', 'ласковая', 'родная',
    'единственная', 'любимая', 'неотразимая', 'ангельская',
    'волшебная', 'дивная', 'желанная'
  ];

  function createWordRain(containerId, count){
    var container = document.getElementById(containerId);
    if(!container) return;
    container.innerHTML = '';
    for(var i=0;i<count;i++){
      var el = document.createElement('div');
      el.className = 'rain-item word';
      el.textContent = compliments[Math.floor(Math.random()*compliments.length)] + ' ✦';
      var left = Math.random()*95;
      var size = 0.85 + Math.random()*0.85;
      var duration = 15 + Math.random()*18;
      var delay = Math.random()*22;
      el.style.left = left + '%';
      el.style.fontSize = size + 'rem';
      el.style.animationDuration = duration + 's';
      el.style.animationDelay = delay + 's';
      container.appendChild(el);
    }
  }

  function createStarRain(containerId, count){
    var container = document.getElementById(containerId);
    if(!container) return;
    container.innerHTML = '';
    for(var i=0;i<count;i++){
      var el = document.createElement('div');
      el.className = 'rain-item star';
      el.textContent = '✦';
      var left = Math.random()*98;
      var size = 0.6 + Math.random()*1.1;
      var duration = 12 + Math.random()*16;
      var delay = Math.random()*20;
      el.style.left = left + '%';
      el.style.fontSize = size + 'rem';
      el.style.animationDuration = duration + 's';
      el.style.animationDelay = delay + 's';
      container.appendChild(el);
    }
  }

  createWordRain('complimentsRain', 28);
  createStarRain('starsRain', 22);

  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      createWordRain('complimentsRain', 28);
      createStarRain('starsRain', 22);
    }, 600);
  });

  var page1 = document.getElementById('page1');
  var page2 = document.getElementById('page2');
  var page3 = document.getElementById('page3');
  var page4 = document.getElementById('page4');
  var page5 = document.getElementById('page5');

  var waxSeal = document.getElementById('waxSeal');
  var ribbon = document.getElementById('ribbon');
  var codeInput = document.getElementById('codeInput');
  var codeBtn = document.getElementById('codeBtn');
  var codeError = document.getElementById('codeError');
  var goToInvite = document.getElementById('goToInvite');
  var confirmTime = document.getElementById('confirmTime');
  var timePicker = document.getElementById('timePicker');

  var daysEl = document.getElementById('days');
  var hoursEl = document.getElementById('hours');
  var minutesEl = document.getElementById('minutes');
  var secondsEl = document.getElementById('seconds');

  function showPage(page){
    document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
    page.classList.add('active');
  }

  waxSeal.addEventListener('click', function(e){
    e.stopPropagation();
    waxSeal.classList.add('cracking');
    ribbon.classList.add('untying');
    setTimeout(function(){
      showPage(page2);
      setTimeout(function(){ codeInput.focus(); }, 250);
    }, 550);
  });

  function checkCode(){
    var val = codeInput.value.trim();
    if(val === CORRECT_CODE){
      codeError.classList.remove('show');
      showPage(page3);
    } else {
      codeError.classList.add('show');
      codeInput.value = '';
      codeInput.focus();
      setTimeout(function(){ codeError.classList.remove('show'); }, 2800);
    }
  }

  codeInput.addEventListener('input', function(){
    var val = this.value.trim();
    codeBtn.classList.toggle('active', val.length >= 4);
    codeError.classList.remove('show');
  });

  codeInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && this.value.trim().length >= 4){ checkCode(); }
  });

  codeBtn.addEventListener('click', checkCode);

  goToInvite.addEventListener('click', function(){ showPage(page4); });

confirmTime.addEventListener('click', function(){
  var selectedTime = timePicker.value || '19:00';
  
  // Отправка через Formspree
  fetch('https://formspree.io/f/mljryrvq', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Accept': 'application/json'
    },
    body: JSON.stringify({
      time: selectedTime,
      date: '25 августа 2026',
      message: 'Душка выбрала время для свидания! ❤'
    })
  })
  .then(function(response) {
    if (response.ok) {
      console.log('✅ Письмо отправлено!');
    } else {
      console.log('❌ Ошибка отправки');
    }
  })
  .catch(function(error) {
    console.log('❌ Ошибка:', error);
  });

  showPage(page5);
  startTimer(selectedTime);
});

  function startTimer(selectedTime){
    var parts = selectedTime.split(':').map(Number);
    var target = new Date(2026, 7, 26, parts[0], parts[1], 0);

    function updateTimer(){
      var now = new Date();
      var diff = target - now;

      if(diff <= 0){
        ['days','hours','minutes','seconds'].forEach(function(id){
          document.getElementById(id).textContent = '00';
        });
        return;
      }

      var d = Math.floor(diff / (1000*60*60*24));
      var h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
      var m = Math.floor((diff % (1000*60*60)) / (1000*60));
      var s = Math.floor((diff % (1000*60)) / 1000);

      daysEl.textContent = String(d).padStart(2,'0');
      hoursEl.textContent = String(h).padStart(2,'0');
      minutesEl.textContent = String(m).padStart(2,'0');
      secondsEl.textContent = String(s).padStart(2,'0');
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  }
})();
</script>

</body>
</html>
